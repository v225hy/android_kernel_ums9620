name: CP3NV1 kernel build

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name from arch/arm64/configs"
        required: false
        default: "sprd_qogirn6pro_defconfig"
        type: string
      kcflags:
        description: "Extra KCFLAGS (blank = tree default, which is -Werror)"
        required: false
        default: "-Wno-error"
        type: string
      ccache_max_size:
        description: "ccache size limit"
        required: false
        default: "3G"
        type: string
  push:
    branches: [master]
    paths:
      - '.github/workflows/cp3nv1-kernel-build.yml'
      - 'arch/arm64/configs/*defconfig'
      - 'arch/arm64/boot/dts/sprd/**'
      - 'drivers/gpu/drm/sprd/**'
      - 'drivers/regulator/**'
      - 'include/uapi/**'
      - 'fs/f2fs/**'
      - 'crypto/lz4*.c'
      - 'lib/lz4/**'
      - 'include/linux/lz4.h'
      - 'include/linux/ion.h'
      - 'drivers/staging/android/ion/cp3nv1_abi_check.c'
      - 'scripts/check-cp3nv1-panel.py'
      - 'scripts/repack-cp3nv1-boot.sh'
      - 'boot/stock/boot.img'

concurrency:
  group: cp3nv1-kernel-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.defconfig || 'sprd_qogirn6pro_defconfig' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
      LLVM: "1"
      DEFCONFIG: ${{ inputs.defconfig || 'sprd_qogirn6pro_defconfig' }}
      KCFLAGS_EXTRA: ${{ github.event_name == 'workflow_dispatch' && inputs.kcflags || '-Wno-error' }}
      # Stable ccache behaviour across runners: kernel builds embed paths and
      # __TIME__-like macros that would otherwise defeat the cache.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_SLOPPINESS: "file_macro,time_macros,include_file_mtime,include_file_ctime"
      CCACHE_MAXSIZE: ${{ inputs.ccache_max_size || '3G' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # drivers/kernelsu is a symlink into this submodule; Kconfig needs it.
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev lz4 zstd xz-utils \
            device-tree-compiler gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-14 llvm-14 lld-14 cpio ccache git make zip wget \
            libc6-dev-arm64-cross libc6-dev-armel-cross
          # Select the complete LLVM 14 suite for configure AND build.
          echo '/usr/lib/llvm-14/bin' >> "$GITHUB_PATH"

      - name: Test LZ4 workspace compression
        run: sh lib/lz4/test-workspace.sh

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cp3nv1-llvm14-${{ env.DEFCONFIG }}-${{ runner.os }}
          max-size: ${{ env.CCACHE_MAXSIZE }}
          verbose: 1

      - name: Configure kernel
        run: |
          set -eu
          make -s CC="ccache clang" "$DEFCONFIG"
          # Stock vendor_boot supplies the display stack and these providers.
          # Keep providers modular so their in-tree copies are not in Image.
          scripts/config --file .config -d REGULATOR_SM5109 -d DRM_SPRD \
            -m UNISOC_IOMMU -m DVFS_APSYS_SPRD -m SPRD_SOCID \
            -m TRUSTY -m TRUSTY_LOG -m TRUSTY_VIRTIO -m TRUSTY_VIRTIO_IPC \
            -d E_SHOW_MEM \
            -e KSU -d KSU_TRACEPOINT_HOOK -e KSU_MANUAL_HOOK -e THINLTO
          make -s CC="ccache clang" olddefconfig
          clang --version | head -1
          ld.lld --version
          llvm-ar --version | head -1
          grep -E '^CONFIG_(LOCALVERSION|LTO_CLANG|CFI_CLANG|COMPAT_VDSO|DRM_SPRD|REGULATOR_SM5109)=' .config
          grep -qx '# CONFIG_REGULATOR_SM5109 is not set' .config
          grep -qx '# CONFIG_DRM_SPRD is not set' .config
          # Stock IOMMU reads ion_buffer.sg_table at offset 104. E_SHOW_MEM
          # inserts an rb_node at the front and changes this module ABI.
          grep -qx '# CONFIG_E_SHOW_MEM is not set' .config
          for provider in UNISOC_IOMMU DVFS_APSYS_SPRD SPRD_SOCID TRUSTY TRUSTY_LOG TRUSTY_VIRTIO TRUSTY_VIRTIO_IPC; do
            grep -qx "CONFIG_${provider}=m" .config
          done
          grep -qx 'CONFIG_LTO_CLANG=y' .config
          grep -qx 'CONFIG_CFI_CLANG=y' .config

      - name: Verify stock ION module layout
        run: |
          set -o pipefail
          if ! make CC="ccache clang" KCFLAGS="$KCFLAGS_EXTRA" \
              drivers/staging/android/ion/cp3nv1_abi_check.o 2>&1 | tee /tmp/ion-check.log; then
            python3 - <<'PY'
          import pathlib
          text = pathlib.Path('/tmp/ion-check.log').read_text()[-16000:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit 1
          fi

      - name: Build raw kernel Image
        run: |
          set -o pipefail
          ccache --zero-stats
          free -h
          df -h .
          if ! make -j2 \
                CC="ccache clang" \
                KCFLAGS="$KCFLAGS_EXTRA" \
                Image 2>&1 | tee /tmp/build.log; then
            {
              echo '### Build failed — last 120 lines'
              echo '```'
              tail -120 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
          import pathlib, re
          lines = pathlib.Path('/tmp/build.log').read_text(errors='replace').splitlines()
          errors = []
          for i, line in enumerate(lines):
              if re.search(r'error:|undefined reference|Error [0-9]|Killed|No rule to make|error |unifdef:|leak|not found|No such file', line, re.I):
                  errors.extend(lines[max(0, i-2):i+2])
          errors = list(dict.fromkeys(errors))
          report = '\n'.join(errors[:100] or lines[-60:])
          escaped = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Kernel build diagnostic::' + escaped)
          PY
            ccache --show-stats
            exit 1
          fi
          test -s arch/arm64/boot/Image
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Repack stock boot with new kernel
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/magiskboot"
          wget -q --https-only -O "$RUNNER_TEMP/Magisk-v28.1.apk" \
            https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk
          python3 - <<'PY'
          import os, pathlib, zipfile
          dst = pathlib.Path(os.environ['RUNNER_TEMP']) / 'magiskboot/magiskboot'
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'Magisk-v28.1.apk') as apk:
              dst.write_bytes(apk.read('lib/x86_64/libmagiskboot.so'))
          dst.chmod(0o755)
          PY
          bash scripts/repack-cp3nv1-boot.sh "$RUNNER_TEMP/magiskboot/magiskboot"

      - name: Upload repacked boot image
        uses: actions/upload-artifact@v4
        with:
          name: CP3NV1-boot
          path: out-boot/
          if-no-files-found: error
          compression-level: 0

      - name: Collect artifacts
        if: always()
        run: |
          set -eu
          mkdir -p out-artifacts
          cp .config out-artifacts/kernel.config
          for f in arch/arm64/boot/Image arch/arm64/boot/Image.gz vmlinux Module.symvers; do
            [ -f "$f" ] && cp "$f" out-artifacts/ || true
          done
          if ls drivers/gpu/drm/sprd/sprd-drm.ko >/dev/null 2>&1; then
            cp drivers/gpu/drm/sprd/sprd-drm.ko out-artifacts/ || true
          fi
          if ls drivers/regulator/sm5109-regulator.ko >/dev/null 2>&1; then
            cp drivers/regulator/sm5109-regulator.ko out-artifacts/ || true
          fi
          find . -name '*.ko' -not -path './out-artifacts/*' -print0 2>/dev/null \
            | tar --null -czf out-artifacts/kernel-modules.tar.gz -T - || true
          printf '%s\n' \
            'UNVERIFIED BUILD. Built from the 5.4.302 source tree, not the stock 5.4.210 release.' \
            'Raw Image here; separately repacked experimental boot.img is in CP3NV1-boot.' \
            'GPIO pinmux and bias register encoding remain unproven; do not flash blind.' \
            > out-artifacts/README.txt
          ls -l out-artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp3nv1-kernel-${{ github.sha }}
          path: out-artifacts/
          if-no-files-found: warn

      - name: Upload raw Image binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CP3NV1-Image
          path: arch/arm64/boot/Image
          if-no-files-found: error
          compression-level: 0
